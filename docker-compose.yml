services:
  backend:
    build: ./backend
    container_name: java-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/data:/app/data
    environment:
      - SERVER_ADDRESS=0.0.0.0
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: react-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app        
      - /app/node_modules      
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
